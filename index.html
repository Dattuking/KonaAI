<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kona AI | Secured Production RAG Platform</title>
    <style>
        :root { --surface: #070a13; --card: #111827; --primary: #2563eb; --font: #f9fafb; --font-dim: #9ca3af; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--surface); color: var(--font); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Production Auth Gate Panel Overlay styles */
        #auth-gate { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--surface); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-card h2 { margin-bottom: 8px; color: var(--font); font-size: 26px; font-weight: 800; }
        .auth-card p { color: var(--font-dim); font-size: 14px; margin-bottom: 24px; }
        .auth-card input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 8px; color: white; font-size: 15px; margin-bottom: 16px; outline: none; }
        .auth-card button { width: 100%; padding: 14px; background: var(--primary); border: none; color: white; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 8px; }
        .auth-toggle-link { color: var(--primary); margin-top: 16px; font-size: 14px; cursor: pointer; display: inline-block; text-decoration: underline; }
        .auth-msg { font-size: 14px; margin-top: 12px; display: none; padding: 10px; border-radius: 6px; }
        .msg-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .msg-success { background: rgba(52, 211, 153, 0.1); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.2); }

        /* Main Workspace Application UI Styling */
        header { padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 800; font-size: 24px; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { font-size: 14px; color: var(--font-dim); background: transparent; border: 1px solid rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
        #chat-canvas { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 30px; }
        .message-row { max-width: 85%; padding: 20px 24px; border-radius: 16px; font-size: 16px; line-height: 1.7; word-wrap: break-word; }
        .user-side { background-color: var(--primary); align-self: flex-end; border-bottom-right-radius: 3px; }
        .kona-side { background-color: var(--card); align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid rgba(255,255,255,0.04); }
        .citation-container { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.06); }
        .citation-card { background: rgba(37, 99, 235, 0.08); border: 1px solid rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 6px 14px; border-radius: 8px; font-size: 13px; text-decoration: none; font-weight: 500; }
        #input-dock { padding: 30px 15%; background: var(--surface); position: sticky; bottom: 0; }
        .interactive-bar { display: flex; background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 8px 16px; align-items: center; }
        .interactive-bar input { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-size: 16px; outline: none; }
        .interactive-bar button { background: var(--primary); color: white; border: none; padding: 12px 26px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .system-wait { font-style: italic; color: var(--font-dim); }

        /* Structural Text Formatting Custom Parser Render Styles */
        .parsed-response p { margin-bottom: 14px; }
        .parsed-response .code-window-block { background: #000000; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 18px; margin: 16px 0; overflow-x: auto; font-family: monospace; font-size: 14px; color: #f9fafb; line-height: 1.5; white-space: pre; display: block; }
        .parsed-response h3 { margin: 20px 0 10px 0; color: #60a5fa; font-weight: 700; font-size: 19px; }
        .parsed-response .inline-code-token { font-family: monospace; color: #34d399; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="auth-gate">
        <div class="auth-card">
            <h2 id="auth-title">⚡ Kona AI</h2>
            <p id="auth-subtitle">Sign in to your encrypted search node</p>
            
            <input type="email" id="auth-email" placeholder="Email Address">
            <input type="password" id="auth-password" placeholder="Password">
            
            <button id="auth-submit-btn" onclick="executeAuthAction()">Sign In</button>
            
            <div id="auth-toggle-msg">
                New to Kona AI? <span class="auth-toggle-link" onclick="toggleAuthMode(true)">Create an Account</span>
            </div>
            
            <div id="status-feedback" class="auth-msg"></div>
        </div>
    </div>

    <header>
        <span>⚡ Kona AI</span>
        <button class="logout-btn" onclick="terminateSession()">Lock Console</button>
    </header>
    
    <div id="chat-canvas">
        <div class="message-row kona-side">
            Welcome to Kona AI. Your production session is secure. Submit a query in any language to execute vector and real-time hybrid searches.
        </div>
    </div>

    <div id="input-dock">
        <div class="interactive-bar">
            <input type="text" id="user-query" placeholder="Ask anything or request modifications..." onkeydown="if(event.key==='Enter') dispatchKonaEngine()">
            <button onclick="dispatchKonaEngine()">Search</button>
        </div>
    </div>

    <script>
        const API_BASE = "https://dattu2004-konaai-backend.hf.space/api/v1"; 
        let conversationHistory = [];
        let isRegisterMode = false;

        // Verify session status on system startup
        window.onload = function() {
            if (localStorage.getItem("kona_jwt_token")) {
                document.getElementById("auth-gate").style.display = "none";
            }
        };

        function toggleAuthMode(toRegister) {
            isRegisterMode = toRegister;
            const title = document.getElementById("auth-title");
            const subtitle = document.getElementById("auth-subtitle");
            const btn = document.getElementById("auth-submit-btn");
            const toggleArea = document.getElementById("auth-toggle-msg");
            const feedback = document.getElementById("status-feedback");
            
            feedback.style.display = "none";
            
            if (isRegisterMode) {
                title.innerText = "Register Node";
                subtitle.innerText = "Create an profile to start querying";
                btn.innerText = "Register";
                toggleArea.innerHTML = `Already registered? <span class="auth-toggle-link" onclick="toggleAuthMode(false)">Sign In</span>`;
            } else {
                title.innerText = "⚡ Kona AI";
                subtitle.innerText = "Sign in to your encrypted search node";
                btn.innerText = "Sign In";
                toggleArea.innerHTML = `New to Kona AI? <span class="auth-toggle-link" onclick="toggleAuthMode(true)">Create an Account</span>`;
            }
        }

        async function executeAuthAction() {
            const email = document.getElementById("auth-email").value.trim();
            const password = document.getElementById("auth-password").value;
            const feedback = document.getElementById("status-feedback");

            if (!email || !password) {
                showFeedback("Please fill out all credentials.", true);
                return;
            }

            try {
                if (isRegisterMode) {
                    // Registration Path (JSON payload match)
                    const res = await fetch(`${API_BASE}/auth/register`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: email, password: password })
                    });
                    const data = await res.json();
                    
                    if (!res.ok) throw new Error(data.detail || "Registration failed.");
                    
                    showFeedback("Registration complete! Switching to Sign In...", false);
                    setTimeout(() => toggleAuthMode(false), 1500);
                } else {
                    // Login Path (OAuth2 specifications require x-www-form-urlencoded payloads)
                    const formData = new URLSearchParams();
                    formData.append("username", email);
                    formData.append("password", password);

                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/x-www-form-urlencoded" },
                        body: formData
                    });
                    const data = await res.json();

                    if (!res.ok) throw new Error(data.detail || "Login authorization failed.");

                    // Save the cryptographically signed JWT token inside application storage arrays
                    localStorage.setItem("kona_jwt_token", data.access_token);
                    showFeedback("Node authenticated! Loading terminal...", false);
                    setTimeout(() => {
                        document.getElementById("auth-gate").style.display = "none";
                    }, 1000);
                }
            } catch (err) {
                showFeedback(err.message, true);
            }
        }

        function showFeedback(msg, isError) {
            const el = document.getElementById("status-feedback");
            el.className = `auth-msg ${isError ? 'msg-error' : 'msg-success'}`;
            el.innerText = msg;
            el.style.display = "block";
        }

        function terminateSession() {
            localStorage.removeItem("kona_jwt_token");
            conversationHistory = [];
            document.getElementById("chat-canvas").innerHTML = `
                <div class="message-row kona-side">Console locked. Session logs cleared safely.</div>
            `;
            document.getElementById("auth-email").value = "";
            document.getElementById("auth-password").value = "";
            document.getElementById("auth-gate").style.display = "flex";
            toggleAuthMode(false);
        }

        function nativeRenderMarkdown(rawString) {
            let processedHtml = "";
            let dataSegments = rawString.split("```");
            for (let idx = 0; idx < dataSegments.length; idx++) {
                if (idx % 2 === 1) {
                    let codeLines = dataSegments[idx].split("\n");
                    let cleanLang = codeLines[0].trim().toLowerCase();
                    if (["python", "javascript", "c", "cpp", "html"].includes(cleanLang)) {
                        codeLines.shift();
                    }
                    processedHtml += `<div class="code-window-block">${codeLines.join("\n").trim()}</div>`;
                } else {
                    let currentTextSegment = dataSegments[idx];
                    currentTextSegment = currentTextSegment.replace(/###\s+(.*)/g, "<h3>$1</h3>");
                    currentTextSegment = currentTextSegment.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
                    currentTextSegment = currentTextSegment.replace(/`(.*?)`/g, '<code class="inline-code-token">$1</code>');
                    processedHtml += currentTextSegment.split("\n").map(sentence => {
                        if (sentence.trim().startsWith("<h3>") || sentence.trim().startsWith("<div")) return sentence;
                        return sentence.trim() ? `<p>${sentence}</p>` : "";
                    }).join("");
                }
            }
            return processedHtml;
        }

        async function dispatchKonaEngine() {
            const inputField = document.getElementById("user-query");
            const rawPrompt = inputField.value.trim();
            if(!rawPrompt) return;
            inputField.value = "";

            const canvas = document.getElementById("chat-canvas");
            const userBox = document.createElement("div");
            userBox.className = "message-row user-side";
            userBox.innerText = rawPrompt;
            canvas.appendChild(userBox);

            conversationHistory.push({ role: "user", content: rawPrompt });

            const konaBox = document.createElement("div");
            konaBox.className = "message-row kona-side";
            const stateLoader = document.createElement("span");
            stateLoader.className = "system-wait";
            stateLoader.innerText = "Interrogating hybrid retrieval indexes...";
            konaBox.appendChild(stateLoader);
            canvas.appendChild(konaBox);
            canvas.scrollTop = canvas.scrollHeight;

            const secureToken = localStorage.getItem("kona_jwt_token");

            try {
                const response = await fetch(`${API_BASE}/search`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${secureToken}` // Attach secure bearer authorization token payload headers
                    },
                    body: JSON.stringify({ history: conversationHistory })
                });

                if(response.status === 401) {
                    throw new Error("Session expired. Please log out and authenticate again.");
                }

                const streamReader = response.body.getReader();
                const stringDecoder = new TextDecoder("utf-8");
                konaBox.innerHTML = ""; 
                
                const citationWrapper = document.createElement("div");
                citationWrapper.className = "citation-container";
                citationWrapper.style.display = "none";
                konaBox.appendChild(citationWrapper);

                const textBodyBlock = document.createElement("div");
                textBodyBlock.className = "parsed-response";
                konaBox.appendChild(textBodyBlock);
                
                let citationsAdded = false;
                let streamingResponseTracker = "";

                while(true) {
                    const { value, done } = await streamReader.read();
                    if(done) break;

                    const rawChunk = stringDecoder.decode(value, { stream: true });
                    const structuralLines = rawChunk.split("\n");

                    for(const structuralLine of structuralLines) {
                        if(structuralLine.startsWith("data: ")) {
                            const dataPayload = JSON.parse(structuralLine.slice(6));
                            
                            if(dataPayload.type === "metadata" && !citationsAdded && dataPayload.sources.length > 0) {
                                citationWrapper.style.display = "flex";
                                dataPayload.sources.forEach(sourceItem => {
                                    const sourceButton = document.createElement("a");
                                    sourceButton.className = "citation-card";
                                    sourceButton.href = sourceItem.url;
                                    sourceButton.target = "_blank";
                                    sourceButton.innerText = `[${sourceItem.id}] ${sourceItem.title.substring(0,18)}...`;
                                    citationWrapper.appendChild(sourceButton);
                                });
                                citationsAdded = true;
                            } else if(dataPayload.type === "token") {
                                streamingResponseTracker += dataPayload.text;
                                textBodyBlock.innerHTML = nativeRenderMarkdown(streamingResponseTracker);
                            } else if(dataPayload.type === "error") {
                                textBodyBlock.innerHTML += `<span style='color:#ef4444;'>\n[Engine Error: ${dataPayload.message}]</span>`;
                            }
                        }
                    }
                    canvas.scrollTop = canvas.scrollHeight;
                }

                conversationHistory.push({ role: "assistant", content: streamingResponseTracker });

            } catch (err) {
                konaBox.innerHTML = `<span style='color:#ef4444;'>Security Block: ${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
