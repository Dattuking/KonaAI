<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kona AI | Secured Multilingual Context Search Engine</title>
    <style>
        :root { --surface: #070a13; --card: #111827; --primary: #2563eb; --font: #f9fafb; --font-dim: #9ca3af; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--surface); color: var(--font); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Login Screen Overlay */
        #auth-gate { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--surface); display: flex; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.3s ease; }
        .auth-card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-card h2 { margin-bottom: 20px; color: var(--primary); font-size: 26px; }
        .auth-card input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 8px; color: white; font-size: 16px; margin-bottom: 20px; outline: none; text-align: center; }
        .auth-card button { width: 100%; padding: 14px; background: var(--primary); border: none; color: white; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; }
        .auth-error { color: #ef4444; font-size: 14px; margin-top: 12px; display: none; }

        /* Main Workspace Interface Layout */
        header { padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 800; font-size: 24px; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { font-size: 14px; color: var(--font-dim); background: transparent; border: 1px solid rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 6px; cursor: pointer; }
        #chat-canvas { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 30px; }
        .message-row { max-width: 85%; padding: 20px 24px; border-radius: 16px; font-size: 16px; line-height: 1.7; word-wrap: break-word; }
        .user-side { background-color: var(--primary); align-self: flex-end; border-bottom-right-radius: 3px; }
        .kona-side { background-color: var(--card); align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid rgba(255,255,255,0.04); }
        .citation-container { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.06); }
        .citation-card { background: rgba(37, 99, 235, 0.08); border: 1px solid rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 6px 14px; border-radius: 8px; font-size: 13px; text-decoration: none; font-weight: 500; }
        #input-dock { padding: 30px 15%; background: var(--surface); position: sticky; bottom: 0; }
        .interactive-bar { display: flex; background: var(--card); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 8px 16px; align-items: center; }
        .interactive-bar input { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-size: 16px; outline: none; }
        .interactive-bar button { background: var(--primary); color: white; border: none; padding: 12px 26px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .system-wait { font-style: italic; color: var(--font-dim); }

        /* Output Formatter Render Design Engine Layout Rules */
        .parsed-response p { margin-bottom: 14px; }
        .parsed-response .code-window-block { background: #000000; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 18px; margin: 16px 0; overflow-x: auto; font-family: monospace; font-size: 14px; color: #f9fafb; line-height: 1.5; white-space: pre; display: block; }
        .parsed-response h3 { margin: 20px 0 10px 0; color: #60a5fa; font-weight: 700; font-size: 19px; }
        .parsed-response .inline-code-token { font-family: monospace; color: #34d399; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- Authentication Window Lock -->
    <div id="auth-gate">
        <div class="auth-card">
            <h2>Kona AI Security</h2>
            <input type="password" id="access-pass" placeholder="Enter Access Password" onkeydown="if(event.key==='Enter') validateAuthToken()">
            <button onclick="validateAuthToken()">Unlock Terminal</button>
            <div id="error-alert" class="auth-error">Incorrect Access Password. Please try again.</div>
        </div>
    </div>

    <!-- Main Dynamic Application Workspace Layout Screen Layer -->
    <header>
        <span>⚡ Kona AI</span>
        <button class="logout-btn" onclick="terminateSession()">Lock App</button>
    </header>
    
    <div id="chat-canvas">
        <div class="message-row kona-side">
            Welcome to Kona AI. Context memory tracking is now enabled. You can ask queries and request changes to code layouts natively.
        </div>
    </div>

    <div id="input-dock">
        <div class="interactive-bar">
            <input type="text" id="user-query" placeholder="Ask anything or request structural changes..." onkeydown="if(event.key==='Enter') dispatchKonaEngine()">
            <button onclick="dispatchKonaEngine()">Search</button>
        </div>
    </div>

    <script>
        const SERVER_ROUTER = "https://dattu2004-konaai-backend.hf.space/api/v1/search"; 
        
        // Context Track Memory Array Array elements mapping layout stack
        let conversationHistory = [];

        // Simple runtime validation rule token checking
        function checkSystemAuth() {
            if (localStorage.getItem("kona_session_active") === "true") {
                document.getElementById("auth-gate").style.display = "none";
            }
        }

        function validateAuthToken() {
            const passwordInput = document.getElementById("access-pass").value;
            // Set your custom security authorization password key here
            if (passwordInput === "admin123") { 
                localStorage.setItem("kona_session_active", "true");
                document.getElementById("auth-gate").style.display = "none";
                document.getElementById("error-alert").style.display = "none";
            } else {
                document.getElementById("error-alert").style.display = "block";
            }
        }

        function terminateSession() {
            localStorage.removeItem("kona_session_active");
            document.getElementById("access-pass").value = "";
            document.getElementById("auth-gate").style.display = "flex";
        }

        function nativeRenderMarkdown(rawString) {
            let processedHtml = "";
            let dataSegments = rawString.split("```");
            for (let idx = 0; idx < dataSegments.length; idx++) {
                if (idx % 2 === 1) {
                    let codeLines = dataSegments[idx].split("\n");
                    let cleanLang = codeLines[0].trim().toLowerCase();
                    if (["python", "javascript", "c", "cpp", "html"].includes(cleanLang)) {
                        codeLines.shift();
                    }
                    processedHtml += `<div class="code-window-block">${codeLines.join("\n").trim()}</div>`;
                } else {
                    let currentTextSegment = dataSegments[idx];
                    currentTextSegment = currentTextSegment.replace(/###\s+(.*)/g, "<h3>$1</h3>");
                    currentTextSegment = currentTextSegment.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
                    currentTextSegment = currentTextSegment.replace(/`(.*?)`/g, '<code class="inline-code-token">$1</code>');
                    processedHtml += currentTextSegment.split("\n").map(sentence => {
                        if (sentence.trim().startsWith("<h3>") || sentence.trim().startsWith("<div")) return sentence;
                        return sentence.trim() ? `<p>${sentence}</p>` : "";
                    }).join("");
                }
            }
            return processedHtml;
        }

        async function dispatchKonaEngine() {
            const inputField = document.getElementById("user-query");
            const rawPrompt = inputField.value.trim();
            if(!rawPrompt) return;
            inputField.value = "";

            const canvas = document.getElementById("chat-canvas");
            const userBox = document.createElement("div");
            userBox.className = "message-row user-side";
            userBox.innerText = rawPrompt;
            canvas.appendChild(userBox);

            // Push fresh entry array elements frame token maps into memory array list
            conversationHistory.push({ role: "user", content: rawPrompt });

            const konaBox = document.createElement("div");
            konaBox.className = "message-row kona-side";
            const stateLoader = document.createElement("span");
            stateLoader.className = "system-wait";
            stateLoader.innerText = "Scanning contextual indexes...";
            konaBox.appendChild(stateLoader);
            canvas.appendChild(konaBox);
            canvas.scrollTop = canvas.scrollHeight;

            try {
                // Send the entire tracked memory stack downstream onto your backend route handler
                const response = await fetch(SERVER_ROUTER, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ history: conversationHistory })
                });

                const streamReader = response.body.getReader();
                const stringDecoder = new TextDecoder("utf-8");
                konaBox.innerHTML = ""; 
                
                const citationWrapper = document.createElement("div");
                citationWrapper.className = "citation-container";
                citationWrapper.style.display = "none";
                konaBox.appendChild(citationWrapper);

                const textBodyBlock = document.createElement("div");
                textBodyBlock.className = "parsed-response";
                konaBox.appendChild(textBodyBlock);
                
                let citationsAdded = false;
                let streamingResponseTracker = "";

                while(true) {
                    const { value, done } = await streamReader.read();
                    if(done) break;

                    const rawChunk = stringDecoder.decode(value, { stream: true });
                    const structuralLines = rawChunk.split("\n");

                    for(const structuralLine of structuralLines) {
                        if(structuralLine.startsWith("data: ")) {
                            const dataPayload = JSON.parse(structuralLine.slice(6));
                            
                            if(dataPayload.type === "metadata" && !citationsAdded && dataPayload.sources.length > 0) {
                                citationWrapper.style.display = "flex";
                                dataPayload.sources.forEach(sourceItem => {
                                    const sourceButton = document.createElement("a");
                                    sourceButton.className = "citation-card";
                                    sourceButton.href = sourceItem.url;
                                    sourceButton.target = "_blank";
                                    sourceButton.innerText = `[${sourceItem.id}] ${sourceItem.title.substring(0,18)}...`;
                                    citationWrapper.appendChild(sourceButton);
                                });
                                citationsAdded = true;
                            } else if(dataPayload.type === "token") {
                                streamingResponseTracker += dataPayload.text;
                                textBodyBlock.innerHTML = nativeRenderMarkdown(streamingResponseTracker);
                            } else if(dataPayload.type === "error") {
                                textBodyBlock.innerHTML += `<span style='color:#ef4444;'>\n[Engine Error: ${dataPayload.message}]</span>`;
                            }
                        }
                    }
                    canvas.scrollTop = canvas.scrollHeight;
                }

                // Append the fully synthesized response into the memory buffer for the next question turn
                conversationHistory.push({ role: "assistant", content: streamingResponseTracker });

            } catch (networkError) {
                konaBox.innerHTML = "<span style='color:#ef4444;'>Connection lost. Verify your backend Space status.</span>";
            }
        }

        // Run security checks on page initial boot cycles
        window.onload = checkSystemAuth;
    </script>
</body>
</html>
